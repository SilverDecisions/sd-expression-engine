name: CI

on:
  push:
    branches: [master, modernize]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build check (Node ${{ matrix.node }}, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 24: developer version (.nvmrc); 22: previous LTS
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The committed dist/ is the 0.1.17 release build (gulp/browserify): the
      # contract tests and the Jasmine specs must keep passing on it
      - name: Tests on the committed dist (0.1.17 build) and the sources
        run: npm test

      # Isolated copy: npm ci, build, artifacts (ES5, source maps), tests on the
      # four fresh bundles and the sources, tarball installed into a browserify +
      # babelify consumer, compile error exit code
      - name: npm run test:build
        run: npm run test:build

  windows-smoke:
    name: Build smoke (Node ${{ matrix.node }}, Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: npm run build
        timeout-minutes: 10
        run: npm run build

      - name: Tests on the fresh dist (standalone and module bundles, plain and minified), the sources and the Jasmine specs
        run: npm test

      - name: The build changed nothing outside dist/
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- . ':(exclude)dist')"
          echo "$changes"
          test -z "$changes"

      - name: Build check in an isolated copy (without the consumer install)
        run: node scripts/check-build.js --skip-consumer
